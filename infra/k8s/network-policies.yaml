# #1228: the namespaceSelector values below (esustellar-monitoring) match the
# namespace used by infra/monitoring/* manifests. #1227: deny-all-egress plus the
# allow-dns-egress / allow-only-api-egress policies form the default-deny egress set.
#
# Scope note (#1125): these policies govern the `esustellar` application
# namespace only. The deployer-key-rotation workload has its own namespace
# (`esustellar-keyops`) and its own default-deny policies in
# infra/k8s/keyops.yaml — deliberately separate, so a rotation pod cannot inherit
# the web ingress rules and a web pod cannot inherit key-rotation egress.
# Nothing in this file selects pods in `esustellar-keyops`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: esustellar
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress: []
---
# Default-deny egress: pods may only reach the explicit allow rules below
# (DNS + the web's outbound 443/80 + monitoring namespace). A compromised pod
# cannot exfiltrate data to or reach arbitrary external hosts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-egress
  namespace: esustellar
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: esustellar
spec:
  podSelector:
    matchLabels:
      app: esustellar-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring
  namespace: esustellar
spec:
  podSelector:
    matchLabels:
      app: esustellar-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: esustellar-monitoring
      ports:
        - port: 9464
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: esustellar
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-only-api-egress
  namespace: esustellar
spec:
  podSelector:
    matchLabels:
      app: esustellar-web
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
        - port: 80
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: esustellar-monitoring
