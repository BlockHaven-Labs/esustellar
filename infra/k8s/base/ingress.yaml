apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: esustellar-web
  namespace: esustellar
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
# #1224: esustellar.io is the mainnet default; each overlay patches the host and
# TLS hosts/secretName (staging.esustellar.io, testnet.esustellar.io).
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - esustellar.io
      secretName: esustellar-web-tls
  rules:
    - host: esustellar.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: esustellar-web
                port:
                  name: http
