# #1226: scales on CPU (70%) and memory (80%); the memory limit is 512Mi in the base Deployment.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: esustellar-web
  namespace: esustellar
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: esustellar-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
