apiVersion: apps/v1
kind: Deployment
metadata:
  name: esustellar-web
  namespace: esustellar
  labels:
    app: esustellar-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: esustellar-web
  template:
    metadata:
      labels:
        app: esustellar-web
    spec:
      containers:
        - name: web
          # #1222: `latest` is only a placeholder; every overlay replaces the tag via
          # `images:`. For reproducible rollouts, CI should set an immutable tag
          # (git SHA or semver), e.g. `kustomize edit set image ...:<sha>`, rather
          # than the moving *-latest tags.
          image: ghcr.io/blockhaven-labs/esustellar-web:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: esustellar-web-config
            - secretRef:
                name: esustellar-web-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
