apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: esustellar
resources:
  - ../../base
images:
  - name: ghcr.io/blockhaven-labs/esustellar-web
    newTag: mainnet-latest
commonLabels:
  app.kubernetes.io/version: "mainnet-latest"
replicas:
  - name: esustellar-web
    count: 3
patches:
  - target:
      kind: Deployment
      name: esustellar-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: NEXT_PUBLIC_NETWORK
            value: public
          - name: STELLAR_NETWORK
            value: public
  # #1018: mainnet owns the apex domain.
  - target:
      kind: Ingress
      name: esustellar-web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: esustellar.io
  # #1019: Certificate is the authoritative TLS source (no ingress annotation).
  - target:
      kind: Certificate
      name: esustellar-web-tls
    patch: |-
      - op: replace
        path: /spec/secretName
        value: esustellar-web-tls
