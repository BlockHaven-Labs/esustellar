apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: esustellar
resources:
  - ../../base
images:
  - name: ghcr.io/blockhaven-labs/esustellar-web
    newTag: mainnet-latest
commonLabels:
  app.kubernetes.io/version: "mainnet-latest"
# The replicas transformer only sets the Deployment's replica count. The base
# HorizontalPodAutoscaler (minReplicas: 2) would otherwise scale mainnet below
# this baseline once its scale-down window expires, so the HPA floor is patched
# to match below (#1103). Keep `count` and the HPA minReplicas in sync.
replicas:
  - name: esustellar-web
    count: 3
patches:
  # #1103: HPA floor must equal the intended mainnet baseline capacity.
  - target:
      kind: HorizontalPodAutoscaler
      name: esustellar-web
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target:
      kind: Deployment
      name: esustellar-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: NEXT_PUBLIC_NETWORK
            value: public
          - name: STELLAR_NETWORK
            value: public
  # #1018: mainnet owns the apex domain.
  - target:
      kind: Ingress
      name: esustellar-web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: esustellar.io
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - esustellar.io
  # #1019: Certificate is the authoritative TLS source (no ingress annotation).
  - target:
      kind: Certificate
      name: esustellar-web-tls
    patch: |-
      - op: replace
        path: /spec/secretName
        value: esustellar-web-tls
