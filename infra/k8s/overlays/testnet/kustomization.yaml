apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: esustellar-testnet
resources:
  - ../../base
images:
  - name: ghcr.io/blockhaven-labs/esustellar-web
    newTag: testnet-latest
commonLabels:
  app.kubernetes.io/version: "testnet-latest"
# Deliberate cost/availability tradeoff (#1104): testnet runs a single replica
# to save cost, and a pod crash or node loss means a short outage. That is
# acceptable for testnet only; do not copy this to staging or mainnet.
# Two things make 1 replica behave as intended:
#   1. The base HPA has minReplicas: 2, which would silently scale testnet back
#      up to 2, so the HPA is patched below (floor 1, ceiling 3).
#   2. Deploys use maxUnavailable: 0 / maxSurge: 1, so the new pod must pass its
#      readiness probe before the old one is removed (no gap during a deploy).
# Keep `count` and the HPA minReplicas in sync.
replicas:
  - name: esustellar-web
    count: 1
patches:
  # #1104: HPA floor must equal the intended testnet baseline capacity.
  - target:
      kind: HorizontalPodAutoscaler
      name: esustellar-web
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  # #1104: explicit rolling update so a single replica never drops to zero
  # ready pods mid-deploy (same values as the legacy k8s/deployments/*.yaml).
  - target:
      kind: Deployment
      name: esustellar-web
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
  - target:
      kind: Deployment
      name: esustellar-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: NEXT_PUBLIC_NETWORK
            value: testnet
          - name: STELLAR_NETWORK
            value: testnet
  # #1111: single-replica testnet needs the opposite probe posture from
  # mainnet. There is no second replica to absorb an eviction, so a readiness
  # probe that fails twice would take the whole environment offline for a
  # transient blip; thresholds are loosened (readiness 15s period / 6 failures,
  # liveness 6 failures) and the liveness initial delay is raised to 60s to
  # cover cold starts on a small cluster without restart loops.
  - target:
      kind: Deployment
      name: esustellar-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/periodSeconds
        value: 15
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/failureThreshold
        value: 6
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
        value: 60
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/failureThreshold
        value: 6
  # #1018: testnet claims testnet.esustellar.io (DNS module creates
  # ${environment}.${domain_name}).
  - target:
      kind: Ingress
      name: esustellar-web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: testnet.esustellar.io
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - testnet.esustellar.io
      - op: replace
        path: /spec/tls/0/secretName
        value: esustellar-web-tls-testnet
  # #1019: Certificate is the authoritative TLS source (no ingress annotation).
  - target:
      kind: Certificate
      name: esustellar-web-tls
    patch: |-
      - op: replace
        path: /spec/commonName
        value: testnet.esustellar.io
      - op: replace
        path: /spec/secretName
        value: esustellar-web-tls-testnet
      - op: replace
        path: /spec/dnsNames
        value:
          - testnet.esustellar.io
