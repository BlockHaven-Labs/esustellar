apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: esustellar-monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: 'default'
      routes:
        - match:
            severity: critical
          receiver: 'critical'
        - match:
            severity: warning
          receiver: 'warning'
    receivers:
      - name: 'default'
        slack_configs:
          - api_url: '{{ .Env.SLACK_WEBHOOK_URL }}'
            channel: '#ops-alerts'
            title: '{{ .GroupLabels.alertname }}'
            text: '{{ .CommonAnnotations.description }}'
      - name: 'critical'
        slack_configs:
          - api_url: '{{ .Env.SLACK_WEBHOOK_URL }}'
            channel: '#ops-critical'
            title: '{{ .GroupLabels.alertname }}'
            text: '{{ .CommonAnnotations.description }}'
      - name: 'warning'
        slack_configs:
          - api_url: '{{ .Env.SLACK_WEBHOOK_URL }}'
            channel: '#ops-warnings'
            title: '{{ .GroupLabels.alertname }}'
            text: '{{ .CommonAnnotations.description }}'
