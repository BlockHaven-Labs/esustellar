apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: esustellar-monitoring
resources:
  - prometheus-deployment.yaml
  - alertmanager-deployment.yaml
  # #1122: this used to be pulled in as ../../../k8s/monitoring/balance-exporter.yaml,
  # i.e. from the deprecated top-level k8s/ tree — three levels up and outside this
  # kustomization's own directory. That cross-tree reference meant `kustomize build`
  # (and plain `kubectl kustomize`) failed with the default root-only load
  # restrictor, and any reorganisation of either tree would have broken it
  # silently. The manifest now lives beside the Prometheus config that scrapes it,
  # so every path in this list is relative to this directory.
  - balance-exporter.yaml
configMapGenerator:
  - name: prometheus-alert-rules
    files:
      - alert-rules.yaml
      - rpc-alerts.yaml
