# #1010: last-rotation tracker.
#
# The actual secret values can't be inspected from CI, so rotation is
# tracked here instead: update a secret's `last_rotated` date (ISO 8601,
# UTC) immediately after rotating it. .github/workflows/secret-rotation-
# check.yml reads this file daily and opens a tracking issue once a
# secret is within warning_days of its rotation_days deadline.
#
# rotation_days values mirror the table in infra/secrets/README.md.
# SLACK_WEBHOOK_URL is rotated "on personnel change", not on a fixed
# cadence, so it is intentionally not tracked here.

DEPLOYER_SECRET_KEY:
  last_rotated: "2026-09-24"
  rotation_days: 90
  warning_days: 14

NEXTAUTH_SECRET:
  last_rotated: "2026-09-24"
  rotation_days: 90
  warning_days: 14

GRAFANA_ADMIN_PASSWORD:
  last_rotated: "2026-09-24"
  rotation_days: 180
  warning_days: 14
