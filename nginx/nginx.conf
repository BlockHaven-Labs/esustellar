worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Issue #908 — Rate limiting zones (defined in rate-limit.conf)
    include /etc/nginx/rate-limit.conf;

    # ── Bad bot / WAF blocking ────────────────────────────────────────────
    # Referenced from rate-limit.conf map blocks

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;
        http2 on;

        # SSL
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header X-XSS-Protection          "1; mode=block"                       always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy        "geolocation=(), microphone=()"       always;

        # Block bad bots
        if ($bad_bot) {
            return 403;
        }

        # Block bad paths
        if ($bad_path) {
            return 403;
        }

        # Connection limit
        limit_conn conn 50;

        # API routes — moderate rate limit
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;

            proxy_pass         http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Auth / wallet-connect — strict rate limit
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Claim endpoints — moderate rate limit
        location /api/claim/ {
            limit_req zone=claim burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Static assets — lenient rate limit
        location /_next/static/ {
            limit_req zone=static burst=200 nodelay;

            proxy_pass http://web:3000/_next/static/;
            expires    365d;
            add_header Cache-Control "public, immutable";
        }

        # Default — general rate limit
        location / {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;

            proxy_pass         http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
