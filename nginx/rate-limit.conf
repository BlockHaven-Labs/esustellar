# Issue #908 — Rate limiting / WAF-style configuration for nginx.
#
# This file defines rate limiting zones and WAF-style rules.
# Include it in the main nginx.conf inside the http { } block.

# ── Rate Limiting Zones ─────────────────────────────────────────────────────

# General API: 20 req/s per IP, burst of 40
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Wallet connect / auth endpoints: 5 req/s per IP (stricter)
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

# Claim endpoints: 10 req/s per IP (moderate)
limit_req_zone $binary_remote_addr zone=claim:10m rate=10r/s;

# Static assets: 100 req/s per IP (lenient)
limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;

# ── Connection Limiting ─────────────────────────────────────────────────────

limit_conn_zone $binary_remote_addr zone=conn:10m;

# ── WAF-style Rules ─────────────────────────────────────────────────────────

# Block common bot patterns
map $http_user_agent $bad_bot {
    default 0;
    ~*(?:scrapy|curl|wget|python-requests|go-http-client) 1;
    ~*(?:nikto|sqlmap|nmap|masscan) 1;
}

# Block common attack paths
map $request_uri $bad_path {
    default 0;
    ~*\.(env|git|svn|htaccess|htpasswd)$ 1;
    ~*/wp-admin|wp-login|xmlrpc 1;
    ~*/\.well-known/security 0;  # Allow ACME
}

# Custom error pages
limit_req_status 429;
limit_conn_status 429;

# Logging
log_format rate_limit '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'limit_req=$limit_req_status';

access_log /var/log/nginx/rate-limit.log rate_limit;
