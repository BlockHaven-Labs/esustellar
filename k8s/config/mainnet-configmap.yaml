# #1290: TEMPLATE ONLY — no mainnet contract IDs are committed here.
# Apply only the output of infra/scripts/render-configmap.sh with real IDs
# injected from the deploy job's secrets; validate-configmaps.* rejects the
# ${...} placeholders below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: esustellar-config
  namespace: esustellar-mainnet
  labels:
    app: esustellar-web
    environment: mainnet
  annotations:
    esustellar.io/config-template: "true"
data:
  NEXT_PUBLIC_SAVINGS_CONTRACT_ID: "${NEXT_PUBLIC_SAVINGS_CONTRACT_ID}"
  NEXT_PUBLIC_REGISTRY_CONTRACT_ID: "${NEXT_PUBLIC_REGISTRY_CONTRACT_ID}"
  NEXT_PUBLIC_CONTRACT_ID: "${NEXT_PUBLIC_CONTRACT_ID}"
