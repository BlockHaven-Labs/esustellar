name: Secret Scanning

# #1015, #1468: secret scanning on every pull request, with particular attention
# to infra/, environments/ and k8s/.
#
# The infra/ tree operates on raw deployer secret keys and hosts secrets-adjacent
# docs; k8s/config/ contains literal *-secret.yaml files that must only ever
# hold SealedSecrets or non-sensitive placeholders, never raw values.
#
# This runs the gitleaks CLI directly instead of gitleaks/gitleaks-action@v2:
# the action refuses to run for repositories owned by an organization unless a
# paid GITLEAKS_LICENSE secret is configured ("[BlockHaven-Labs] is an
# organization. License key is required"), so every run of the previous version
# of this workflow failed. The CLI is MIT licensed and needs no key.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scan only the commits this event adds, so findings already in history
      # cannot fail unrelated pull requests. Matches are redacted in the log.
      - name: Scan new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${BEFORE_SHA}..${AFTER_SHA}"
          else
            RANGE="${AFTER_SHA}"
          fi
          echo "Scanning commit range: $RANGE"
          gitleaks detect --source . --log-opts="$RANGE" --redact --no-banner --verbose

  raw-secret-manifests:
    name: no raw Kubernetes Secret values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Secret manifests
        run: python3 infra/scripts/check-raw-secrets.py
