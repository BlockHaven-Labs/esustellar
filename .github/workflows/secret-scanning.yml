name: Secret Scanning

# #1015: gitleaks secret-scanning for infra/, environments/, and k8s/ trees.
#
# The infra/ tree operates on raw deployer secret keys and hosts secrets-adjacent
# docs; k8s/config/ contains literal *-secret.yaml files that must only ever
# hold SealedSecrets, never raw values. Runs gitleaks on every PR so scaffolding
# mistakes fail the build instead of leaking credentials.

on:
  pull_request:
    paths:
      - "infra/**"
      - "environments/**"
      - "k8s/**"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "environments/**"
      - "k8s/**"

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}