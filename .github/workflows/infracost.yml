# #555: Infracost CI integration — cost estimation on pull requests.
#
# Requires INFRACOST_API_KEY secret to be set in the repository.
# Advisory only: it is not a required status check. If the secret is
# unset or revoked, the steps are skipped with a warning instead of
# failing the PR (issue #1258).
#
# #1284: A second job (k8s-workload-cost) estimates the monthly compute cost
# of running the full Kubernetes stack across mainnet (3 replicas), staging
# (2 replicas), and testnet (1 replica). It reads resource requests/limits
# from infra/k8s/base/deployment.yaml and replica counts from the kustomize
# overlays, then posts the result as a PR comment via $GITHUB_STEP_SUMMARY
# and gh pr comment. No external API key is required for this job.

name: Infracost Cost Estimate

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/k8s/**"
      - "scripts/k8s-cost-estimate.sh"

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Terraform / cloud-resource cost estimation via Infracost
  # (unchanged from #555 — only triggers on infra/terraform/** changes)
  # ---------------------------------------------------------------------------
  infracost:
    name: Infracost Cost Estimate
    runs-on: ubuntu-latest
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    steps:
      - name: Warn when API key is unset
        if: env.INFRACOST_API_KEY == ''
        run: echo "::warning::INFRACOST_API_KEY is not set; skipping cost estimate."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Infracost
        if: env.INFRACOST_API_KEY != ''
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost Breakdown
        if: env.INFRACOST_API_KEY != ''
        run: |
          infracost breakdown --path infra/terraform/ \
            --format json \
            --out-file infracost-breakdown.json

      - name: Annotate PR with Cost Estimate
        if: env.INFRACOST_API_KEY != ''
        uses: infracost/actions/comment@v3
        with:
          path: infracost-breakdown.json
          behavior: update

  # ---------------------------------------------------------------------------
  # Job 2: K8s workload compute cost estimation (#1284)
  # Runs whenever k8s overlays or the estimation script itself change.
  # Advisory only — never a required status check.
  # ---------------------------------------------------------------------------
  k8s-workload-cost:
    name: K8s Workload Cost Estimate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x scripts/k8s-cost-estimate.sh

      - name: Run K8s workload cost estimate
        id: k8s_cost
        run: |
          # Capture Markdown output and write it to the step summary
          REPORT=$(./scripts/k8s-cost-estimate.sh)
          echo "$REPORT" >> "$GITHUB_STEP_SUMMARY"

          # Persist for the comment step (multiline-safe via delimiter)
          {
            echo "report<<EOF_REPORT"
            echo "$REPORT"
            echo "EOF_REPORT"
          } >> "$GITHUB_OUTPUT"

      - name: Post cost estimate as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = `${{ steps.k8s_cost.outputs.report }}`;
            const marker = '<!-- k8s-workload-cost-estimate -->';
            const body = `${marker}\n${report}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
