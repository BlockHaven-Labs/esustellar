# #1011: Runs the "kubeseal --validate -f infra/secrets/" check from
# infra/secrets/README.md's Verification checklist as an actual CI
# step, instead of a manual step someone can forget, so an invalid
# SealedSecret can't be merged and only get caught by `kubectl apply`
# in staging/production.
#
# --validate asks the live sealed-secrets controller whether it can
# decrypt the manifest, it isn't an offline format check, so this
# needs cluster access. It reuses the KUBE_CONFIG repo secret that
# infra/secrets/README.md already documents for deployment.

name: Validate Sealed Secrets

on:
  pull_request:
    paths:
      - "infra/secrets/**"

permissions:
  contents: read

jobs:
  validate-sealed-secrets:
    name: kubeseal --validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find SealedSecret manifests
        id: find
        run: |
          mapfile -t FILES < <(find infra/secrets -type f \( -name "*.yaml" -o -name "*.yml" \) ! -name "last-rotated.yml")
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No SealedSecret manifests under infra/secrets/ yet; nothing to validate."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${FILES[@]}" > /tmp/sealed-secret-files.txt
            cat /tmp/sealed-secret-files.txt
          fi

      - name: Install kubeseal
        if: steps.find.outputs.found == 'true'
        run: |
          set -e
          KUBESEAL_VERSION="0.27.3"
          curl -fsSL -o kubeseal.tar.gz \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz"
          tar -xzf kubeseal.tar.gz kubeseal
          sudo install -m 0755 kubeseal /usr/local/bin/kubeseal
          kubeseal --version

      - name: Configure cluster access
        if: steps.find.outputs.found == 'true'
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -e
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "::error::KUBE_CONFIG repo secret is not set; kubeseal --validate needs cluster access to the sealed-secrets controller."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Validate each manifest
        if: steps.find.outputs.found == 'true'
        # Override these if the controller isn't in the default
        # kube-system/sealed-secrets-controller location for this cluster.
        env:
          CONTROLLER_NAMESPACE: kube-system
          CONTROLLER_NAME: sealed-secrets-controller
        run: |
          set -e
          status=0
          while IFS= read -r f; do
            echo "Validating $f"
            if ! kubeseal --validate \
                  --controller-namespace "$CONTROLLER_NAMESPACE" \
                  --controller-name "$CONTROLLER_NAME" \
                  -f "$f"; then
              echo "::error file=$f::kubeseal validation failed"
              status=1
            fi
          done < /tmp/sealed-secret-files.txt
          exit $status
