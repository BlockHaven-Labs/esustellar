# #998: Terraform state-locking verification + drift-detection CI.
#
# - Validate:   runs on every PR touching infra, catches syntax/fmt breakage
#               without needing any AWS credentials.
# - Drift:      scheduled `terraform plan` against the live S3 backend; the
#               job FAILS when the plan detects changes (drift) so infra never
#               silently diverges from what's in version control.
# - Locking:    scheduled assertion that the DynamoDB lock table actually
#               blocks a concurrent `terraform plan`.
#
# The AWS-backed jobs only run on schedule/workflow_dispatch. Configure the
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY repository secrets to enable them.

name: Terraform Drift & State Locking

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/testnet/**"

permissions:
  contents: read

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Format check
        run: terraform fmt -check -recursive infra/

      - name: Validate infra/terraform
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

      - name: Validate infra/testnet
        working-directory: infra/testnet
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

  drift-detection:
    name: Detect Terraform Drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Skip when AWS credentials are not configured
        if: env.AWS_ACCESS_KEY_ID == ''
        run: echo "::warning::AWS credentials not configured; skipping drift detection."

      - name: Plan infra/terraform for each environment (fail on drift)
        if: env.AWS_ACCESS_KEY_ID != ''
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          for environment in testnet staging mainnet; do
            cfg="backend/${environment}.hcl"
            echo "==> Drift check for ${environment} (${cfg})"
            terraform init -input=false -reconfigure -backend-config="${cfg}"
            set +e
            terraform plan -detailed-exitcode -input=false -no-color -var="environment=${environment}"
            code=$?
            set -e
            if [ "$code" -eq 2 ]; then echo "DRIFT DETECTED (${environment})"; exit 1; fi
            if [ "$code" -ne 0 ]; then exit "$code"; fi
          done

      - name: Plan infra/testnet (fail on drift)
        if: env.AWS_ACCESS_KEY_ID != ''
        working-directory: infra/testnet
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure
          set +e
          terraform plan -detailed-exitcode -input=false -no-color
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then echo "DRIFT DETECTED (infra/testnet)"; exit 1; fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi

  state-locking:
    name: Verify State Locking
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Skip when AWS credentials are not configured
        if: env.AWS_ACCESS_KEY_ID == ''
        run: echo "::warning::AWS credentials not configured; skipping lock verification."

      - name: Verify DynamoDB state locking
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          BACKEND_CONFIG: backend/mainnet.hcl
          LOCK_TABLE_NAME: esustellar-terraform-locks
          STATE_BUCKET_NAME: esustellar-terraform-state
          STATE_KEY: infra/terraform/mainnet/terraform.tfstate
        run: infra/terraform/scripts/verify-state-lock.sh infra/terraform
