name: Mobile E2E (Detox)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-e2e.yml'
  workflow_dispatch:
    inputs:
      skip_ios:
        description: 'Skip iOS tests (macOS runner is expensive)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_android:
        description: 'Skip Android tests'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # iOS — macOS runner with Xcode
  # ────────────────────────────────────────────────────────────────────────────
  e2e-ios:
    name: E2E iOS (Detox / iPhone 15)
    runs-on: macos-latest
    if: ${{ github.event.inputs.skip_ios != 'true' }}
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        working-directory: .
        run: npm ci

      # applesimutils is required by Detox for iOS simulator control
      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew install applesimutils

      # Install CocoaPods dependencies for the native iOS build
      - name: Install CocoaPods
        run: |
          cd ios && pod install --repo-update
        env:
          NO_FLIPPER: 1

      # Build the release binary that Detox will run
      - name: Build iOS release (Detox)
        run: npm run e2e:build:ios
        env:
          RCT_NO_LAUNCH_PACKAGER: true

      # Run the full E2E suite
      - name: Run iOS E2E tests
        run: npm run e2e:ci:ios
        env:
          CI: true

      # Upload Detox artifacts (screenshots / logs) when tests fail
      - name: Upload iOS test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-ios-artifacts-${{ github.run_number }}
          path: mobile/.artifacts/ci
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Android — Ubuntu runner with Android Emulator
  # ────────────────────────────────────────────────────────────────────────────
  e2e-android:
    name: E2E Android (Detox / Pixel 6 API 34)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_android != 'true' }}
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Set up Java 17 (required by Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Enable KVM acceleration for the emulator on Linux (significantly
      # faster than software emulation).
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Android AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-pixel6-api34-${{ runner.os }}-${{ hashFiles('mobile/.detoxrc.js') }}

      - name: Create AVD and generate snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: Pixel_6_API_34
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created and snapshot saved."

      # Build the release APK that Detox will install
      - name: Build Android release (Detox)
        run: npm run e2e:build:android

      # Run the full E2E suite inside the emulator
      - name: Run Android E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: Pixel_6_API_34
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: mobile
          script: npm run e2e:ci:android
        env:
          CI: true

      # Upload Detox artifacts (screenshots / logs) when tests fail
      - name: Upload Android test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-android-artifacts-${{ github.run_number }}
          path: mobile/.artifacts/ci
          retention-days: 7
