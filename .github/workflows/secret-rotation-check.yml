# #1010: Reminds the team when a secret in infra/secrets/README.md's
# rotation table is approaching (or past) its deadline. The actual
# secret values can't be inspected from CI, so this checks the
# committed infra/secrets/last-rotated.yml date file instead.

name: Secret Rotation Check

on:
  schedule:
    - cron: "0 9 * * *" # daily, 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-rotation:
    name: Check secret rotation deadlines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run rotation check
        id: check
        run: |
          set +e
          python3 infra/scripts/check-secret-rotation.py > rotation-report.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat rotation-report.txt

      - name: Open or update tracking issue
        if: steps.check.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh label create secret-rotation --color FBCA04 \
            --description "Tracks scheduled secret rotation reminders" 2>/dev/null || true

          TITLE="Secret rotation due"
          BODY_FILE="$(mktemp)"
          {
            echo "One or more secrets from infra/secrets/README.md's rotation table are due or overdue:"
            echo
            grep '^-' rotation-report.txt || true
            echo
            echo "Rotate the secret(s) above, then update infra/secrets/last-rotated.yml with the new date."
          } > "$BODY_FILE"

          EXISTING="$(gh issue list --search "\"$TITLE\" in:title" --state open --label secret-rotation --json number --jq '.[0].number' || true)"
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label secret-rotation
          fi
