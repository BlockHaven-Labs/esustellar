[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"

[[test]]
name = "integration"
path = "src/lib.rs"

[dependencies]
soroban-sdk = { workspace = true }
esustellar-savings = { path = "../savings" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
