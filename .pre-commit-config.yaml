# Top-level Pre-Commit Hooks Configuration Pipeline
# Reference: Issue #536

default_stages: [commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        description: "Validates structural correctness of YAML configurations"
      - id: end-of-file-fixer
        description: "Ensures style files terminate with a clean line break"
      - id: trailing-whitespace
        description: "Trims unneeded whitespace paddings"

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets (SoroTask Security Gateway)
        description: "Scans staged files for high-entropy tokens and private keys"
        args: ['--baseline', '.secrets.baseline']
        exclude: '(^Cargo\.lock$|^package-lock\.json$|^apps/docs-site/)'

  # #1285: the majority of infra changes are YAML (k8s overlays, monitoring
  # config, workflows) or Terraform. The generic check-yaml hook above only
  # catches syntax errors; yamllint catches indentation/duplicate-key drift
  # that silently changes what kustomize renders. Long lines, missing `---`
  # and unquoted booleans are disabled to match the existing tree.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        name: yamllint (infra, k8s, monitoring, workflows)
        args: ['-d', '{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}']
        files: \.(yaml|yml)$

  # #1126: every Terraform variable must have a top-level `description`. All 58
  # variables currently do, so this hook exists to keep it that way rather than
  # to fix a present failure — a new module is exactly where the description gets
  # forgotten, and its absence is what makes `terraform plan` output and
  # terraform-docs output useless for cross-environment auditing.
  - repo: local
    hooks:
      - id: terraform-variable-docs
        name: terraform variable descriptions
        description: "Fail if any Terraform variable lacks a top-level description"
        entry: python3 infra/scripts/check-terraform-variable-docs.py
        language: system
        files: \.tf$
      # #1285: same formatting check the Terraform CI job runs, moved left so
      # a malformed .tf file never reaches a PR. Requires terraform on PATH.
      - id: terraform-fmt
        name: terraform fmt (check, all roots)
        description: "Fail if any Terraform file is not canonically formatted"
        entry: terraform fmt -check -recursive
        language: system
        files: \.tf$
        pass_filenames: false